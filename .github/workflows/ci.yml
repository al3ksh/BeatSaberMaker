name: CI

on:
  push:
    branches:
      - main
      - plan5-aplikacja
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    env:
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install CPU PyTorch
        run: python -m pip install --no-cache-dir torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install bsmaker
        run: python -m pip install --no-cache-dir -e .

      - name: Fetch pinned ffmpeg and yt-dlp
        shell: pwsh
        run: |
          python packaging/fetch_tools.py --manifest packaging/tools.json --out-dir _ci_tools
          "$PWD\_ci_tools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Run Python tests
        shell: pwsh
        run: |
          $env:PYTHONPATH = "src"
          python -m pytest -q

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install app dependencies
        working-directory: app
        run: npm ci

      - name: Typecheck, unit test, build, and E2E
        working-directory: app
        run: |
          npm run typecheck
          npm test
          npm run build
          npx playwright test

      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: app/test-results/
          retention-days: 7
